name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Environment & Download Tools
        run: |
          brew install p7zip wget
          
      - name: Download Game and Keys
        run: |
          echo "Downloading game NSP..."
          wget -O game.nsp "https://buzzheavier.com/k2cupnstnsgl"
          
          echo "Downloading prod.keys..."
          wget -O prod.keys "https://buzzheavier.com/vxf5ige330cv"
          
      - name: Verify Downloaded Files
        run: |
          ls -la
          echo "Files downloaded successfully!"
