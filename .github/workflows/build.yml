name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and Extract Game NSP
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full wget
          wget -O hactool.zip https://github.com/SciresM/hactool/releases/download/1.4.0/hactool-1.4.0-linux.zip
          7z x hactool.zip -ohactool_bin && chmod +x hactool_bin/hactool
          wget -O prod.keys "https://buzzheavier.com/vxf5ige330cv"
          wget -O game.nsp "https://buzzheavier.com/k2cupnstnsgl"
          mkdir -p game_extracted/exefs game_extracted/romfs
          ./hactool_bin/hactool -k prod.keys -t nsp game.nsp --exefsdir=game_extracted/exefs --romfsdir=game_extracted/romfs
